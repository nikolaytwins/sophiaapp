<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twinlabs — coming soon</title>
    <meta
      name="description"
      content="Design, web development, and AI for your business. Twinlabs website is under construction."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050508;
        --text: #f0f0f8;
        --muted: rgba(255, 255, 255, 0.55);
        --accent: #4da8ff;
        --accent-hover: #6db8ff;
        --violet: #9b6dff;
        --glass: rgba(10, 10, 18, 0.85);
        --border: rgba(255, 255, 255, 0.1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .bg__blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
      }

      .bg__blob--1 {
        top: -15%;
        right: -10%;
        width: min(55vw, 480px);
        height: min(55vw, 480px);
        background: radial-gradient(circle, rgba(77, 168, 255, 0.2) 0%, transparent 70%);
      }

      .bg__blob--2 {
        bottom: -20%;
        left: -5%;
        width: min(50vw, 420px);
        height: min(50vw, 420px);
        background: radial-gradient(circle, rgba(155, 109, 255, 0.14) 0%, transparent 70%);
      }

      .bg__blob--3 {
        top: 35%;
        left: 40%;
        width: 35vw;
        height: 35vw;
        max-width: 360px;
        max-height: 360px;
        background: radial-gradient(circle, rgba(77, 168, 255, 0.08) 0%, transparent 65%);
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(1px 1px at 20px 30px, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1px 1px at 40px 70px, rgba(255, 255, 255, 0.2), transparent),
          radial-gradient(1px 1px at 50px 160px, rgba(255, 255, 255, 0.25), transparent),
          radial-gradient(1px 1px at 90px 40px, rgba(255, 255, 255, 0.15), transparent),
          radial-gradient(1px 1px at 130px 80px, rgba(255, 255, 255, 0.2), transparent),
          radial-gradient(1px 1px at 160px 120px, rgba(255, 255, 255, 0.18), transparent);
        background-size: 200px 200px, 250px 250px, 180px 180px, 220px 220px, 190px 190px, 210px 210px;
        opacity: 0.45;
      }

      .wrap {
        position: relative;
        z-index: 1;
        min-height: 100dvh;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: clamp(1.25rem, 4vw, 2.5rem);
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      }

      .card {
        width: 100%;
        max-width: 520px;
        padding: clamp(1.75rem, 5vw, 2.75rem);
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--border);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 1.25rem;
      }

      .brand__dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px rgba(77, 168, 255, 0.75);
        flex-shrink: 0;
      }

      .brand__name {
        font-family: "Unbounded", system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(1.35rem, 4vw, 1.65rem);
        letter-spacing: -0.02em;
        background: linear-gradient(105deg, var(--text) 0%, var(--accent) 45%, var(--violet) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .tagline {
        font-size: clamp(1rem, 2.8vw, 1.125rem);
        line-height: 1.55;
        color: var(--muted);
        margin: 0 0 1.5rem;
        font-weight: 500;
      }

      .status {
        font-size: 0.9375rem;
        line-height: 1.6;
        color: var(--text);
        margin: 0 0 1.75rem;
        padding: 0.875rem 1rem;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.9rem 1.25rem;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn--primary {
        background: var(--accent);
        color: var(--bg);
        box-shadow: 0 8px 28px rgba(77, 168, 255, 0.35);
      }

      .btn--primary:hover {
        background: var(--accent-hover);
        box-shadow: 0 10px 32px rgba(77, 168, 255, 0.45);
      }

      .btn--ghost {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn--ghost:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(77, 168, 255, 0.35);
      }

      .btn svg {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0.35rem 0 0.15rem;
        color: var(--muted);
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--border), transparent);
      }

      .footer {
        margin-top: clamp(2rem, 6vh, 3rem);
        font-size: 0.8125rem;
        color: rgba(255, 255, 255, 0.35);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="stars"></div>
      <div class="bg__blob bg__blob--1"></div>
      <div class="bg__blob bg__blob--2"></div>
      <div class="bg__blob bg__blob--3"></div>
    </div>

    <main class="wrap">
      <div class="card">
        <div class="brand">
          <span class="brand__dot"></span>
          <span class="brand__name">Twinlabs</span>
        </div>

        <p class="tagline">
          Design, website development, and bringing AI into your business — built around clarity and
          results.
        </p>

        <p class="status">
          Our new site is <strong>under development</strong>. If you would like to talk about a project,
          reach out directly — we will respond personally.
        </p>

        <div class="actions">
          <a class="btn btn--primary" href="https://t.me/niktwins" rel="noopener noreferrer" target="_blank">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
              />
            </svg>
            Telegram
          </a>

          <div class="divider" role="presentation">or email</div>

          <a class="btn btn--ghost" href="mailto:nikolaytwins@gmail.com">nikolaytwins@gmail.com</a>
        </div>
      </div>

      <p class="footer">twinlabs.pro</p>
    </main>
  </body>
</html>
